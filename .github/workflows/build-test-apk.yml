name: Build BOTWRecompAndroid test APK
on:
  push:
    branches: [test-pr-543-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mamcjr/BOTWRecompAndroid
          ref: 213c521feb0a24b0f0d333d9db96e37a90662888
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'ndk;30.0.16248370' 'cmake;3.30.4'
      - name: Build native dependencies
        run: bash android/deps/build_deps.sh
      - name: Build debug APK
        working-directory: android/botwrecompandroid
        run: bash ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BOTWRecompAndroid-PR543-debug
          path: android/botwrecompandroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
